<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply | ORVIA Business in a Box</title><link rel="stylesheet" href="app/globals.css"></head><body><main class="applyPage"><header class="simpleHead"><a href="index.html" class="back">← ORVIA Business in a Box</a><span>APPLICATION / DISCOVERY</span></header><div class="applyShell" id="formWrap"><div class="eyebrow"><span></span> START YOUR ROUTE</div><h1>Tell us where you're starting.</h1><p class="lead">There is no automatic approval or rejection. This gives the commercial team enough context to prepare a useful first conversation.</p><div class="choiceGrid" id="choices"><button class="choice active" data-route="idea"><span class="radio"></span><strong>I have a business idea</strong><small>I want help turning an idea into a viable operating business.</small></button><button class="choice" data-route="existing"><span class="radio"></span><strong>I already run a business</strong><small>I want a better operating system around an existing company.</small></button><button class="choice" data-route="venture"><span class="radio"></span><strong>I want to operate an ORVIA venture</strong><small>I want to lead an ORVIA-developed opportunity.</small></button><button class="choice" data-route="explore"><span class="radio"></span><strong>I want to explore opportunities</strong><small>I am open to the right business opportunity.</small></button></div><form id="applyForm" class="applyForm"><input type="hidden" id="route" name="route" value="idea"><label><span>Your name</span><input required placeholder="Full name"></label><label><span>Email</span><input required type="email" placeholder="you@example.co.uk"></label><label><span>Location</span><input required placeholder="Town / region"></label><label><span>Current role or business</span><input placeholder="What do you do today?"></label><label class="wide"><span>What are you trying to build or change?</span><textarea required rows="5" placeholder="Give us the useful version — sector, idea, customers, what is already in place, and where you are stuck."></textarea></label><label><span>Time available</span><select required><option value="" disabled selected>Select</option><option>Under 10 hours/week</option><option>10–20 hours/week</option><option>20–35 hours/week</option><option>Full-time focus</option></select></label><label><span>Capital position</span><select required><option value="" disabled selected>Select</option><option>Bootstrapping / minimal capital</option><option>Under £5,000</option><option>£5,000–£20,000</option><option>£20,000+</option><option>Prefer to discuss</option></select></label><label class="wide check"><input type="checkbox" required><span>I understand Business in a Box is a licensed operating model and does not guarantee revenue, profit or commercial success.</span></label><button class="primary submit" type="submit">SUBMIT FOR HUMAN REVIEW ↗</button></form></div></main><script>
const params=new URLSearchParams(location.search);const initial=params.get('route');function setRoute(v){document.getElementById('route').value=v;document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('active',b.dataset.route===v));}if(initial)setRoute(initial);document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>setRoute(b.dataset.route)));document.getElementById('applyForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('formWrap').innerHTML='<div class="successMark">✓</div><div class="eyebrow" style="justify-content:center"><span></span> APPLICATION CAPTURED</div><h1 style="text-align:center">That\'s the starting point.</h1><p class="lead" style="text-align:center;max-width:620px;margin:0 auto 30px">This prototype demonstrates the intended journey. In production, the application would create a controlled record for IRIS to summarise before human commercial review.</p><p style="text-align:center"><a class="primary" href="index.html">RETURN TO SITE ↗</a></p>';window.scrollTo(0,0);});
</script></body></html>
